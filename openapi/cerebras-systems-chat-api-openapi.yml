                Image Input:
                  summary: Image Input
                  value:
                    id: chatcmpl-a941cccf-098d-4646-99ae-f93c3b8f3c96
                    choices:
                    - finish_reason: stop
                      index: 0
                      message:
                        role: assistant
                        content: A snippet of Python code defines a function to add two numbers and prints the result.
                        tool_calls: null
                      logprobs: null
