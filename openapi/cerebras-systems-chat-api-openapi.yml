components:
  schemas:
    ChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      properties:
        messages:
          type: array
          description: 'A list of messages comprising the conversation so far. Depending on the model you use, different message types (modalities) are supported, like text and images.

            <br/>

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/SystemMessage'
            - $ref: '#/components/schemas/UserMessage'
            - $ref: '#/components/schemas/AssistantMessage'
            - $ref: '#/components/schemas/ToolMessage'
            - $ref: '#/components/schemas/DeveloperMessage'
            discriminator:
              propertyName: role
              mapping:
                system: '#/components/schemas/SystemMessage'
                user: '#/components/schemas/UserMessage'
                assistant: '#/components/schemas/AssistantMessage'
                tool: '#/components/schemas/ToolMessage'
                developer: '#/components/schemas/DeveloperMessage'
        model:
          type: string
          description: The ID of the model to use for generating a response.
        clear_thinking:
          type: boolean
          nullable: true
          description: 'Controls whether thinking content from previous conversation turns is included in the prompt context.


            - `false` - Thinking from all previous turns is preserved in the conversation history. Recommended for agentic workflows where reasoning from past tool-calling turns may be relevant for future tool calls.

            - `true` (default) - Thinking from earlier turns is excluded. Recommended for general chat conversations where reasoning from past turns is less relevant for performance.


            When this parameter is not specified or set to `null`, the API defaults to `clear_thinking: true`.


            Only supported on the `zai-glm-4.7` model. For additional information, see [Preserved thinking](https://docs.z.ai/guides/capabilities/thinking-mode#preserved-thinking) in the Z.ai documentation.

            '
        frequency_penalty:
          type: number
          nullable: true
          minimum: -2
          maximum: 2
          default: 0
          description: 'A number between -2.0 and 2.0. Positive values reduce the likelihood of the model repeating tokens by applying a penalty proportional to how frequently each token has already appeared in the generated output.

            '
        logit_bias:
          type: object
          nullable: true
          additionalProperties:
            type: number
          default: null
          description: 'Modify the likelihood of specified tokens appearing in the completion. Accepts a JSON object that maps tokens (specified by their token ID in the tokenizer) to an associated bias value from -100 to 100. Mathematically, the bias is added to the logits generated by the model prior to sampling. The exact effect will vary per model, but values between -1 and 1 should decrease or increase likelihood of selection; values like -100 or 100 should result in a ban or exclusive selection of the relevant token.

            '
        logprobs:
          type: boolean
          default: false
          description: 'Whether to return log probabilities of the output tokens.

            '
        max_completion_tokens:
          type: integer
          nullable: true
          description: 'The maximum number of tokens that can be generated in the completion, including reasoning tokens. The total length of input tokens and generated tokens is limited by the model''s context length.

            '
        parallel_tool_calls:
          type: boolean
          nullable: true
          default: true
          description: 'Whether to enable parallel function calling during tool use. When enabled (default), the model can request multiple tool calls simultaneously in a single response. When disabled, only one tool call is made at a time.

            '
        prediction:
          type: object
          nullable: true
          description: 'Configuration for a [Predicted Output](/capabilities/predicted-outputs), which can greatly speed up response times when large parts of the model response are known in advance. Most common when regenerating a file with mostly minor changes.

            '
          required:
          - type
          - content
          properties:
            type:
              type: string
              enum:
              - content
              description: The type of predicted content. Always `content`.
            content:
              description: 'The content that should be matched when generating a model response.

                '
              oneOf:
              - type: string
                description: 'The content used for a given Predicted Output. Typically the text of a file you are regenerating with only minor changes.

                  '
              - type: array
                description: Array of text content parts.
                items:
                  type: object
                  required:
                  - type
                  - text
                  properties:
                    type:
                      type: string
                      enum:
                      - text
                    text:
                      type: string
                      description: The text content.
        presence_penalty:
          type: number
          nullable: true
          minimum: -2
          maximum: 2
          default: 0
          description: 'A number between -2.0 and 2.0. Positive values reduce the likelihood of the model repeating tokens that have already appeared in the output, encouraging the model to introduce new topics.

            '
        prompt_cache_key:
          type: string
          nullable: true
          maxLength: 1024
          default: null
          description: "An opaque identifier that groups related requests so they reuse the\nsame [prompt cache](/capabilities/prompt-caching). Requests sharing the same 'prompt_cache_key' are routed together, which increases cache hits and reduces time to first token.\n\nSet it to a stable identifier like a conversation ID, user ID, or session ID. \n\n**Requires account-level enablement. [Contact us](https://www.cerebras.ai/contact) or reach out to your account representative to request access.**\n"
        reasoning_effort:
          type: string
          nullable: true
          enum:
          - low
          - medium
          - high
          - none
          description: 'Controls the amount of reasoning the model performs. Supported values vary by model:


            - **gpt-oss-120b**: `low`, `medium` (default), `high`

            - **zai-glm-4.7**: `none` (disables reasoning)

            - **gemma-4-31b**: `none` (default), `low`, `medium`, `high` (all enable reasoning equivalently). `raw` and `hidden` reasoning formats are not supported.

            '
        response_format:
          nullable: true
          description: 'An object that controls the format of the model response.


            Setting `{ "type": "json_schema", ... }` enables Structured Outputs, which enforces schema compliance. See [Structured Outputs](/capabilities/structured-outputs) for details.


            Setting `{ "type": "json_object" }` enables legacy JSON mode, which ensures the model returns valid JSON but does not enforce a specific schema. To use `json_object`, include a system or user message specifying the desired format. `json_object` is not compatible with streaming — `stream` must be set to `false`.

            '
          oneOf:
          - $ref: '#/components/schemas/ResponseFormatText'
          - $ref: '#/components/schemas/ResponseFormatJsonSchema'
          - $ref: '#/components/schemas/ResponseFormatJsonObject'
        seed:
          type: integer
          nullable: true
          description: 'If specified, the system will make a best effort to sample deterministically so repeated requests with the same `seed` and parameters return the same result. Determinism is not guaranteed.

            '
        service_tier:
          type: string
          nullable: true
          default: default
          enum:
          - priority
          - default
          - auto
          - flex
          description: "Controls request prioritization. \n\n**Note**: This feature is in **Private Preview**. For access or more information, [contact us](https://www.cerebras.ai/contact) or reach out to your account representative.\n\nAvailable options:\n\n- `priority` - Highest priority processing (Only available for dedicated endpoints, not shared endpoints.)\n- `default` - Standard priority processing\n- `auto` - Automatically uses the highest available service tier\n- `flex` - Lowest priority processing\n\nSee [Service Tiers](/capabilities/service-tiers) for more information.\n"
        stop:
          type: string
          nullable: true
          description: 'Up to 4 sequences where the API will stop generating further tokens. The returned text will not contain the stop sequence.

            '
        stream:
          type: boolean
          nullable: true
          description: 'If set to `true`, partial message deltas will be sent.

            '
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 2
          description: 'Sampling temperature between 0 and 2.0. Higher values (e.g. 0.8) make output more random; lower values (e.g. 0.2) make it more focused and deterministic. We recommend altering this or `top_p`, not both.

            '
        tool_choice:
          description: 'Controls which (if any) tool is called by the model.


            - `none` — no tool is called

            - `auto` — (default when tools are present) the model chooses whether to call a tool

            - `required` — forces a tool call


            A specific tool can be forced by passing an object specifying the function name.

            '
          oneOf:
          - type: string
            enum:
            - none
            - auto
            - required
          - type: object
            required:
            - type
            - function
            properties:
              type:
                type: string
                enum:
                - function
              function:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: The name of the function to call.
        tools:
          type: array
          nullable: true
          description: 'A list of tools the model may call. Use this to provide a list of functions the model may generate JSON inputs for.


            Currently, only functions are supported. Specifying tools consumes prompt tokens; too many may degrade performance or hit context length limits.

            '
          items:
            type: object
            required:
            - type
            - function
            properties:
              type:
                type: string
                enum:
                - function
                description: The type of the tool. Currently only `function` is supported.
              function:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: 'The name of the function to call. Supported characters: `a-z`, `A-Z`, `0-9`, `_`, `-`. Maximum length: 64.

                      '
                  description:
                    type: string
                    description: 'A description of what the function does, used by the model to choose when and how to call the function.

                      '
                  parameters:
                    type: object
                    description: 'The parameters the function accepts, described as a JSON Schema object. Omitting parameters defines a function with an empty parameter list.

                      '
        top_logprobs:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: 'An integer between 0 and 20 specifying the number of most likely tokens to return at each token position, each with an associated log probability. If using this parameter, `logprobs` must also be set to `true`.

            '
        top_p:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: 'Nucleus sampling parameter. The model considers only the tokens comprising the top `top_p` probability mass (e.g. 0.1 means only the tokens comprising the top 10% probability mass are considered). We recommend altering this or `temperature`, not both.

            '
        user:
          type: string
          nullable: true
          description: 'A unique identifier representing your end-user, which can help monitor and detect abuse.

            '
    ResponseFormatText:
      type: object
      title: Text
      description: Text format (default). Generates plain text responses.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
          description: The type of response format being defined. Always `text`.
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
        choices:
          type: array
          description: 'A list of chat completion choices. Can be more than one if `n` is greater than 1.

            '
          items:
            type: object
            properties:
              finish_reason:
                type: string
                enum:
                - stop
                - length
                - content_filter
                - tool_calls
                description: The reason the model stopped generating tokens.
              index:
                type: integer
                description: The index of the choice in the list of choices.
              logprobs:
                type: object
                nullable: true
                description: Log probability information for the output tokens.
              reasoning_logprobs:
                type: object
                nullable: true
                description: 'Log probability information for the reasoning tokens, if provided by the model.

                  '
              message:
                type: object
                description: A chat completion message generated by the model.
                properties:
                  content:
                    type: string
                    nullable: true
                    description: The contents of the message.
                  role:
                    type: string
                    description: The role of the author of this message.
                  reasoning:
                    type: string
                    description: 'The model''s reasoning content when using reasoning models.

                      '
                  tool_calls:
                    type: array
                    nullable: true
                    description: Tool calls the model requested in its response.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of the tool call.
                        type:
                          type: string
                          enum:
                          - function
                          description: The type of tool call.
                        function:
                          type: object
                          description: The function call details.
                          properties:
                            name:
                              type: string
                              description: The name of the function called.
                            arguments:
                              type: string
                              description: 'The JSON-encoded arguments supplied by the model.

                                '
        created:
          type: integer
          description: Unix timestamp (in seconds) of when the completion was created.
        model:
          type: string
          description: The model used for the chat completion.
        object:
          type: string
          enum:
          - chat.completion
          description: The object type. Always `chat.completion`.
        system_fingerprint:
          type: string
          description: 'A fingerprint for the model or backend used to generate the response.

            '
        service_tier:
          type: string
          nullable: true
          description: 'The service tier used for the request, or `null` if not specified.

            '
        service_tier_used:
          type: string
          nullable: true
          enum:
          - priority
          - default
          - flex
          description: 'The service tier used for processing the request. Only present when `service_tier` is set to `auto` in the request.

            '
        usage:
          type: object
          description: Usage statistics for the completion request.
          properties:
            prompt_tokens:
              type: integer
              description: Number of tokens in the prompt.
            completion_tokens:
              type: integer
              description: Number of tokens in the generated completion.
            total_tokens:
              type: integer
              description: Total number of tokens used (prompt + completion).
            image_tokens:
              type: integer
              description: 'Number of tokens used to represent image inputs. Present for requests to vision-capable models.

                '
            prompt_tokens_details:
              type: object
              description: Detailed breakdown of prompt token usage.
              properties:
                cached_tokens:
                  type: integer
                  description: 'Number of prompt tokens served from the cache, reused from a previous request.

                    '
            completion_tokens_details:
              type: object
              description: 'Breakdown of completion tokens when using Predicted Outputs.

                '
              properties:
                accepted_prediction_tokens:
                  type: integer
                  description: 'Tokens in the prediction that appeared in the completion.

                    '
                rejected_prediction_tokens:
                  type: integer
                  description: 'Tokens in the prediction that did not appear in the completion. Counted in total completion tokens for billing, output, and context window limits.

                    '
                reasoning_tokens:
                  type: integer
                  description: Tokens spent on model reasoning, if applicable.
        time_info:
          type: object
          description: Performance timing information for the request.
          properties:
            queue_time:
              type: number
              description: Time spent in queue waiting for processing (seconds).
            prompt_time:
              type: number
              description: Time spent processing prompt/input tokens (seconds).
            completion_time:
              type: number
              description: 'Time spent generating completion/output tokens (seconds).

                '
            total_time:
              type: number
              description: 'Total time for the entire request from submission to completion (seconds).

                '
            created:
              type: number
              description: Unix timestamp of when the time_info was recorded.
    UserMessage:
      type: object
      title: User message
      description: 'Messages sent by an end user, containing prompts or additional context.

        '
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          description: The role of the message author. Always `user`.
        content:
          description: 'The contents of the user message. Can include text and image

            inputs. Supported content types differ by model.

            <br/>

            '
          oneOf:
          - type: string
            description: Text content string.
          - type: array
            description: Array of content parts (text and/or image).
            items:
              oneOf:
              - type: object
                title: Text
                description: Text content part.
                required:
                - type
                - text
                properties:
                  type:
                    type: string
                    enum:
                    - text
                  text:
                    type: string
                    description: The text content.
              - type: object
                title: Image
                description: 'Image content part. **Public Preview.** Images must be provided as base64-encoded PNG or JPEG data. HTTPS image URL ingestion is not supported yet.

                  '
                required:
                - type
                - image_url
                properties:
                  type:
                    type: string
                    enum:
                    - image_url
                  image_url:
                    type: object
                    required:
                    - url
                    properties:
                      url:
                        type: string
                        description: 'The image as a base64-encoded data URI. Format: `data:image/{format};base64,{data}`. Supported formats: `png`, `jpeg`. External URLs (e.g. `https://...`) are not supported.

                          '
        name:
          type: string
          description: 'An optional name for the participant. Provides the model with information to differentiate between participants of the same role.

            '
    ResponseFormatJsonObject:
      type: object
      title: JSON Object
      description: 'JSON object format (legacy). Ensures valid JSON output but does not enforce a specific schema. Using `json_schema` is recommended for models that support it.


        To use `json_object`, include a system or user message specifying the desired format. `json_object` is not compatible with streaming — `stream` must be set to `false`.

        '
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - json_object
          description: The type of response format being defined. Always `json_object`.
    AssistantMessage:
      type: object
      title: Assistant message
      description: Messages sent by the model in response to user messages.
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - assistant
          description: The role of the message author. Always `assistant`.
        content:
          nullable: true
          description: The contents of the assistant message.
          oneOf:
          - type: string
            description: Text content string.
          - type: array
            description: 'Array of content parts. For assistant messages, only type `text` is supported.

              '
            items:
              type: object
              required:
              - type
              - text
              properties:
                type:
                  type: string
                  enum:
                  - text
                text:
                  type: string
        name:
          type: string
          description: An optional name for the participant.
        reasoning:
          type: string
          nullable: true
          description: 'The reasoning content from the model''s response. Include this when passing back assistant messages that contained reasoning.

            '
        tool_calls:
          type: array
          description: Tool calls generated by the model, such as function calls.
          items:
            type: object
            required:
            - id
            - type
            - function
            properties:
              id:
                type: string
                description: The ID of the tool call.
              type:
                type: string
                enum:
                - function
                description: The type of tool. Currently only `function` is supported.
              function:
                type: object
                required:
                - name
                - arguments
                properties:
                  name:
                    type: string
                    description: The name of the function to call.
                  arguments:
                    type: string
                    description: 'The arguments to call the function with, as generated by the model in JSON format.

                      '
    ResponseFormatJsonSchema:
      type: object
      title: JSON Schema
      description: 'JSON Schema format. Enforces schema compliance for structured output. Recommended over `json_object` for models that support it.

        '
      required:
      - type
      - json_schema
      properties:
        type:
          type: string
          enum:
          - json_schema
          description: The type of response format being defined. Always `json_schema`.
        json_schema:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: An optional name for your schema.
            description:
              type: string
              description: 'A description of the response format''s purpose, used by the model to determine how to generate its response.

                '
            schema:
              type: object
              description: 'A valid [JSON Schema](https://json-schema.org/) object that defines the structure, types, and requirements for the response.


                Supports standard JSON Schema features including types (`string`, `number`, `boolean`, `integer`, `object`, `array`, `enum`, `anyOf`, `null`), nested structures, required fields, and `additionalProperties` (must be set to `false`).

                '
            strict:
              type: boolean
              default: false
              description: 'When `true`, enforces strict adherence to the schema. The model will only return fields defined in the schema and with the correct types. When `false`, behaves similar to JSON mode but uses the schema as a guide. Defaults to `false`.

                '
    ToolMessage:
      type: object
      title: Tool message
      description: Tool message containing the result of a tool call.
      required:
      - role
      - content
      - tool_call_id
      properties:
        role:
          type: string
          enum:
          - tool
          description: The role of the message author. Always `tool`.
        content:
          description: The contents of the tool message.
          oneOf:
          - type: string
            description: Text content string.
          - type: array
            description: Array of text content parts.
            items:
              type: object
              required:
              - type
              - text
              properties:
                type:
                  type: string
                  enum:
                  - text
                text:
                  type: string
        tool_call_id:
          type: string
          description: The tool call that this message is responding to.
    DeveloperMessage:
      type: object
      title: Developer message
      description: 'Developer-provided instructions the model should follow regardless of user messages. For `gpt-oss-120b`, developer messages replace system messages, but `system` is still accepted. Only available for the `gpt-oss-120b` model.

        '
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - developer
          description: The role of the message author. Always `developer`.
        content:
          description: The contents of the developer message.
          oneOf:
          - type: string
            description: Text content string.
          - type: array
            description: Array of text content parts.
            items:
              type: object
              required:
              - type
              - text
              properties:
                type:
                  type: string
                  enum:
                  - text
                text:
                  type: string
        name:
          type: string
          description: An optional name for the participant.
    SystemMessage:
      type: object
      title: System message
      description: 'Developer-provided instructions the model should follow regardless of user messages.

        '
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          description: The role of the message author. Always `system`.
        content:
          description: The contents of the system message.
          oneOf:
          - type: string
            description: Text content string.
          - type: array
            description: Array of text content parts.
            items:
              type: object
              required:
              - type
              - text
              properties:
                type:
                  type: string
                  enum:
                  - text
                text:
                  type: string
        name:
          type: string
          description: 'An optional name for the participant. Provides the model with information to differentiate between participants of the same role.

            '
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key for authentication. Obtain your key from the Cerebras Cloud console and pass it as `Authorization: Bearer YOUR_API_KEY`.

        '
