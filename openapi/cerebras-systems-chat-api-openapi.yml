openapi: 3.1.0
info:
  title: Cerebras Inference Chat API
  version: 1.0.0
  description: 'Generate conversational responses using a structured message format with roles (system, user, assistant, developer, tool). Best for chatbots, assistants, and multi-turn conversations.

    '
servers:
- url: https://api.cerebras.ai
  description: Cerebras Inference API
security:
- BearerAuth: []
tags:
- name: Chat
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create chat completion
      description: 'Generate conversational responses using a structured message format with roles (system, user, assistant, developer, tool). Best for chatbots, assistants, and multi-turn conversations.

        '
      parameters:
      - name: Content-Type
        in: header
        description: 'The media type of the request body. Supported values: `application/json`, `application/vnd.msgpack`. Default: `application/json`.

          '
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.msgpack
          default: application/json
      - name: Content-Encoding
        in: header
        description: 'The compression encoding applied to the request body. When set, the request body must be gzip-compressed. Can be combined with any supported `Content-Type`. Supported values: `gzip`.

          '
        schema:
          type: string
          enum:
          - gzip
      - name: queue_threshold
        in: header
        description: 'Controls the queue time threshold for requests using the `flex` or `auto` service tiers. Requests are preemptively rejected if the rolling average queue time exceeds this threshold. Valid range: `50`–`20000` (milliseconds). **Private Preview.**

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              Default:
                summary: Default
                value:
                  model: gpt-oss-120b
                  messages:
                  - role: user
                    content: Hello!
              Image Input:
                summary: Image Input
                value:
                  model: gemma-4-31b
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: Describe this image in one concise sentence.
                    - type: image_url
                      image_url:
                        url: data:image/png;base64,{BASE64_IMAGE}
              Streaming:
                summary: Streaming
                value:
                  model: gpt-oss-120b
                  messages:
                  - role: system
                    content: You are a helpful assistant.
                  - role: user
                    content: Hello!
                  stream: true
              Tool Calling:
                summary: Tool Calling
                value:
                  model: gpt-oss-120b
                  messages:
                  - role: user
                    content: What is the weather like in Boston today?
                  tools:
                  - type: function
                    function:
                      name: get_current_weather
                      description: Get the current weather in a given location
                      parameters:
                        type: object
                        properties:
                          location:
                            type: string
                            description: The city and state, e.g. San Francisco, CA
                          unit:
                            type: string
                            enum:
                            - celsius
                            - fahrenheit
                        required:
                        - location
                  tool_choice: auto
      x-codeSamples:
      - lang: python
        label: Default
        source: "from cerebras.cloud.sdk import Cerebras\nimport os\n\nclient = Cerebras(api_key=os.environ.get(\"CEREBRAS_API_KEY\"))\n\nchat_completion = client.chat.completions.create(\n    model=\"gpt-oss-120b\",\n    messages=[\n        {\"role\": \"user\", \"content\": \"Hello!\"}\n    ],\n)\nprint(chat_completion)\n"
      - lang: javascript
        label: Default
        source: "import Cerebras from '@cerebras/cerebras_cloud_sdk';\n\nconst client = new Cerebras({\n  apiKey: process.env['CEREBRAS_API_KEY'],\n});\n\nasync function main() {\n  const response = await client.chat.completions.create({\n    messages: [{ role: 'user', content: 'Hello!' }],\n    model: 'gpt-oss-120b',\n  });\n\n  console.log(response);\n}\nmain();\n"
      - lang: bash
        label: Default
        source: "curl https://api.cerebras.ai/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer ${CEREBRAS_API_KEY}\" \\\n  -d '{\n    \"model\": \"gpt-oss-120b\",\n    \"messages\": [{\"role\": \"user\", \"content\": \"Hello!\"}]\n  }'\n"
      - lang: python
        label: Image Input
        source: "from cerebras.cloud.sdk import Cerebras\nimport os\nimport base64\n\nclient = Cerebras(api_key=os.environ.get(\"CEREBRAS_API_KEY\"))\n\ndef encode_image(image_path):\n    with open(image_path, \"rb\") as image_file:\n        return base64.b64encode(image_file.read()).decode(\"utf-8\")\n\nbase64_image = encode_image(\"screenshot.png\")\n\nresponse = client.chat.completions.create(\n    model=\"gemma-4-31b\",\n    messages=[\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\"type\": \"text\", \"text\": \"Describe this image in one concise sentence.\"},\n                {\n                    \"type\": \"image_url\",\n                    \"image_url\": {\n                        \"url\": f\"data:image/png;base64,{base64_image}\"\n                    },\n                },\n            ],\n        }\n    ],\n)\n\nprint(response.choices[0].message.content)\n"
      - lang: javascript
        label: Image Input
        source: "import Cerebras from '@cerebras/cerebras_cloud_sdk';\nimport fs from 'fs';\n\nconst client = new Cerebras({\n  apiKey: process.env['CEREBRAS_API_KEY'],\n});\n\nasync function main() {\n  const imageBuffer = fs.readFileSync('screenshot.png');\n  const base64Image = imageBuffer.toString('base64');\n\n  const response = await client.chat.completions.create({\n    model: 'gemma-4-31b',\n    messages: [\n      {\n        role: 'user',\n        content: [\n          { type: 'text', text: 'Describe this image in one concise sentence.' },\n          {\n            type: 'image_url',\n            image_url: {\n              url: `data:image/png;base64,${base64Image}`,\n            },\n          },\n        ],\n      },\n    ],\n  });\n\n  console.log(response.choices[0].message.content);\n}\nmain();\n"
      - lang: bash
        label: Image Input
        source: "BASE64_IMAGE=$(base64 -i screenshot.png)\n\ncurl https://api.cerebras.ai/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer ${CEREBRAS_API_KEY}\" \\\n  -d \"{\n    \\\"model\\\": \\\"gemma-4-31b\\\",\n    \\\"messages\\\": [\n      {\n        \\\"role\\\": \\\"user\\\",\n        \\\"content\\\": [\n          {\\\"type\\\": \\\"text\\\", \\\"text\\\": \\\"Describe this image in one concise sentence.\\\"},\n          {\n            \\\"type\\\": \\\"image_url\\\",\n            \\\"image_url\\\": {\n              \\\"url\\\": \\\"data:image/png;base64,\\${BASE64_IMAGE}\\\"\n            }\n          }\n        ]\n      }\n    ]\n  }\"\n"
      - lang: python
        label: Streaming
        source: "from cerebras.cloud.sdk import Cerebras\nimport os\n\nclient = Cerebras(api_key=os.environ.get(\"CEREBRAS_API_KEY\"))\n\nstream = client.chat.completions.create(\n    model=\"gpt-oss-120b\",\n    messages=[\n        {\"role\": \"system\", \"content\": \"You are a helpful assistant.\"},\n        {\"role\": \"user\", \"content\": \"Hello!\"},\n    ],\n    stream=True,\n)\n\nfor chunk in stream:\n    if chunk.choices[0].delta.content:\n        print(chunk.choices[0].delta.content, end=\"\")\n"
      - lang: javascript
        label: Streaming
        source: "import Cerebras from '@cerebras/cerebras_cloud_sdk';\n\nconst client = new Cerebras({\n  apiKey: process.env['CEREBRAS_API_KEY'],\n});\n\nasync function main() {\n  const stream = await client.chat.completions.create({\n    model: 'gpt-oss-120b',\n    messages: [\n      { role: 'system', content: 'You are a helpful assistant.' },\n      { role: 'user', content: 'Hello!' },\n    ],\n    stream: true,\n  });\n\n  for await (const chunk of stream) {\n    if (chunk.choices[0].delta.content) {\n      process.stdout.write(chunk.choices[0].delta.content);\n    }\n  }\n}\nmain();\n"
      - lang: bash
        label: Streaming
        source: "curl https://api.cerebras.ai/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer ${CEREBRAS_API_KEY}\" \\\n  -d '{\n    \"model\": \"gpt-oss-120b\",\n    \"messages\": [\n      {\"role\": \"system\", \"content\": \"You are a helpful assistant.\"},\n      {\"role\": \"user\", \"content\": \"Hello!\"}\n    ],\n    \"stream\": true\n  }'\n"
      - lang: python
        label: Tool Calling
        source: "from cerebras.cloud.sdk import Cerebras\nimport os\n\nclient = Cerebras(api_key=os.environ.get(\"CEREBRAS_API_KEY\"))\n\ntools = [\n    {\n        \"type\": \"function\",\n        \"function\": {\n            \"name\": \"get_current_weather\",\n            \"description\": \"Get the current weather in a given location\",\n            \"parameters\": {\n                \"type\": \"object\",\n                \"properties\": {\n                    \"location\": {\n                        \"type\": \"string\",\n                        \"description\": \"The city and state, e.g. San Francisco, CA\",\n                    },\n                    \"unit\": {\n                        \"type\": \"string\",\n                        \"enum\": [\"celsius\", \"fahrenheit\"],\n                    },\n                },\n                \"required\": [\"location\"],\n                \"additionalProperties\": False,\n            },\n        },\n    }\n]\n\nresponse = client.chat.completions.create(\n    model=\"gpt-oss-120b\",\n    messages=[\n        {\"role\": \"user\", \"content\": \"What's the weather like in Boston today?\"}\n    ],\n    tools=tools,\n    tool_choice=\"auto\",\n)\n\nprint(response.choices[0].message.tool_calls)\n"
      - lang: javascript
        label: Tool Calling
        source: "import Cerebras from '@cerebras/cerebras_cloud_sdk';\n\nconst client = new Cerebras({\n  apiKey: process.env['CEREBRAS_API_KEY'],\n});\n\nasync function main() {\n  const response = await client.chat.completions.create({\n    model: 'gpt-oss-120b',\n    messages: [\n      { role: 'user', content: \"What's the weather like in Boston today?\" },\n    ],\n    tools: [\n      {\n        type: 'function',\n        function: {\n          name: 'get_current_weather',\n          description: 'Get the current weather in a given location',\n          parameters: {\n            type: 'object',\n            properties: {\n              location: {\n                type: 'string',\n                description: 'The city and state, e.g. San Francisco, CA',\n              },\n              unit: { type: 'string', enum: ['celsius', 'fahrenheit'] },\n            },\n            required: ['location'],\n            additionalProperties: false,\n          },\n        },\n      },\n    ],\n    tool_choice: 'auto',\n  });\n\n  console.log(response.choices[0].message.tool_calls);\n}\nmain();\n"
      - lang: bash
        label: Tool Calling
        source: "curl https://api.cerebras.ai/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer ${CEREBRAS_API_KEY}\" \\\n  -d '{\n    \"model\": \"gpt-oss-120b\",\n    \"messages\": [\n      {\"role\": \"user\", \"content\": \"What is the weather like in Boston today?\"}\n    ],\n    \"tools\": [\n      {\n        \"type\": \"function\",\n        \"function\": {\n          \"name\": \"get_current_weather\",\n          \"description\": \"Get the current weather in a given location\",\n          \"parameters\": {\n            \"type\": \"object\",\n            \"properties\": {\n              \"location\": {\n                \"type\": \"string\",\n                \"description\": \"The city and state, e.g. San Francisco, CA\"\n              },\n              \"unit\": {\n                \"type\": \"string\",\n                \"enum\": [\"celsius\", \"fahrenheit\"]\n              }\n            },\n            \"required\": [\"location\"]\n          }\n        }\n      }\n    ],\n    \"tool_choice\": \"auto\"\n  }'\n"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
              examples:
                Default:
                  summary: Default
                  value:
                    id: chatcmpl-b8d624a5-43d4-477a-8b94-61be750e2872
                    choices:
                    - finish_reason: stop
                      index: 0
