aid: cerebras-systems
name: Cerebras Systems
description: >-
  Cerebras Systems builds the Wafer-Scale Engine (WSE) — the largest computer
  chip ever made — and the CS-3 systems built around it, delivering AI training
  and inference at speeds far beyond conventional GPUs. Cerebras Inference is the
  company's cloud API: an OpenAI-compatible REST interface at api.cerebras.ai
  that serves open-weight frontier models (OpenAI GPT-OSS, Gemma 4, Z.ai GLM 4.7)
  at industry-leading tokens-per-second. Developers authenticate with a bearer
  API key and call chat/completions, completions, and models endpoints, with
  streaming, tool calling, structured outputs, vision, prompt caching, and batch
  inference. Custom model weights can be deployed on dedicated endpoints. Official
  Python and Node.js SDKs, a Cloud Console with a playground, and coding-tool
  integrations (VS Code, Cline, Kilo Code, OpenCode) round out the developer
  surface.
